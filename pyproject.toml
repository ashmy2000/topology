[project]
name = "servicenow-neo4j-outage-demo"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "neo4j>=6.4.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
# our package lives in src/, so imports of kg sort as first-party
src = ["src"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
